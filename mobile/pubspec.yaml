name: mobile
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Network
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Image caching
  cached_network_image: ^3.3.1

  # Crypto for WBI signature
  crypto: ^3.0.3

  # Video playback
  video_player: ^2.8.1
  chewie: ^1.7.0
  wakelock_plus: ^1.1.0

  # Cross-platform video (Windows/Linux/macOS support)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Audio playback with background support
  just_audio: ^0.9.40
  just_audio_windows: ^0.2.2
  audio_service: ^0.18.15
  audio_video_progress_bar: ^2.0.3
  rxdart: ^0.28.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Hive code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
