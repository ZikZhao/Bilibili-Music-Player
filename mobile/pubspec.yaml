name: mobile
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Network
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Image caching
  cached_network_image: ^3.3.1

  # Typography
  google_fonts: ^6.2.1

  # File system
  path_provider: ^2.1.5

  # Crypto for WBI signature
  crypto: ^3.0.3

  # Video playback
  video_player: ^2.8.1
  chewie: ^1.7.0
  wakelock_plus: ^1.1.0

  # Cross-platform video (Windows/Linux/macOS support)
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5
  # Android video support - required for Android platform video rendering
  media_kit_libs_android_video: 1.3.8
  # Audio playback with background support (replaced just_audio with media_kit)
  # just_audio removed: migrated to media_kit
  audio_service: ^0.18.15
  audio_video_progress_bar: ^2.0.3
  rxdart: ^0.28.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Hive code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "launcher_icon"
  ios: true
  adaptive_icon_background: "#121212"
